[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "mastermind-tick"
version = "0.1.0"
description = "mastermind:tick short-horizon paper trading and live strategy console"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.28",
  "uvicorn[standard]>=0.34",
  "websockets>=14",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
mmtick-web = "mastermind_tick.web:main"
mmtick-backtest = "mastermind_tick.backtest:main"
mmtick-profit-backtest = "mastermind_tick.profit_backtest:main"
mmtick-rebuild = "mastermind_tick.rebuild:main"
mmtick-recover = "mastermind_tick.recovery:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mastermind_tick"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
