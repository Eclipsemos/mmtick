[app]
name = "mastermind:tick"
environment = "paper"
database_path = "data/paper.db"
frontend_dist = "frontend/dist"
initial_cash = 100000.0
equity_snapshot_seconds = 10

[strategy]
name = "xiaoguo_atr_tick_v3_sample_optimized"
bar_minutes = 15
atr_period = 21
atr_multiplier = 4.0
position_fraction = 1.0
trend_efficiency_period = 8
minimum_trend_efficiency = 0.25
reversal_confirmation_atr = 0.25

[execution]
fee_bps = 10.0
slippage_bps = 5.0
minimum_notional = 5.0

[history]
warmup_bars = 200

[portfolio_paper]
enabled = true
id = "btc_eth_calendar_router"
symbol = "BTCETH"
display_symbol = "BTC/ETH CALENDAR ROUTER"
name = "BTC/ETH Expanding Calendar Router v1"
venue = "Binance USD-M Futures"
currency = "USDT"
strategy_path = "strategies/paper/btc_eth_expanding_calendar_router_v1.json"
primary_market_id = "btc_perp"
poll_seconds = 900

[live_futures]
enabled = true
instrument_id = "soxl_perp"
account_id = "soxl_perp_live"
strategy_name = "soxl_long_atr32x3_v1"
