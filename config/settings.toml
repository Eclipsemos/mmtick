[app]
name = "mastermind:tick"
environment = "paper"
database_path = "data/paper.db"
frontend_dist = "frontend/dist"
initial_cash = 100000.0
equity_snapshot_seconds = 10

[strategy]
name = "xiaoguo_atr_tick_v3_sample_optimized"
bar_minutes = 15
atr_period = 21
atr_multiplier = 4.0
position_fraction = 1.0
trend_efficiency_period = 8
minimum_trend_efficiency = 0.25
reversal_confirmation_atr = 0.25

[execution]
fee_bps = 10.0
slippage_bps = 5.0
minimum_notional = 5.0

[history]
warmup_bars = 200

[live_spot]
enabled = true
instrument_id = "soxlb"
account_id = "soxlb_live"
database_path = "data/live.db"
api_base_url = "https://api.binance.com"
api_key_env = "API_KEY"
api_secret_env = "SECRET_KEY"
credentials_path = ".env"
operator_token_path = "data/operator.token"
activation_env = "MMTICK_LIVE_CONFIRM"
activation_value = "SOXLBUSDT_LIVE"
allow_order_submission = false
adopt_existing_position = false
position_fraction = 0.05
max_order_notional = 100.0
quote_reserve = 10.0
max_slippage_bps = 30.0
max_daily_loss = 50.0
max_orders_per_day = 6
reconcile_seconds = 5
trade_sync_seconds = 60
order_timeout_seconds = 30
recv_window_ms = 5000

[[instruments]]
id = "soxlb"
symbol = "SOXLBUSDT"
display_symbol = "SOXLB/USDT"
name = "Semicon Bull 3X ETF Tokenized bStock"
asset_type = "tokenized_equity"
venue = "Binance"
currency = "USDT"
feed = "binance"
quantity_step = 0.001
reference_symbol = "SOXL"

[[instruments]]
id = "soxl_perp"
symbol = "SOXLUSDT"
display_symbol = "SOXL/USDT PERP"
name = "Direxion Semiconductor Bull 3X TradFi Perpetual"
asset_type = "tradifi_perpetual"
venue = "Binance USD-M Futures"
currency = "USDT"
feed = "binance_futures"
quantity_step = 0.01
reference_symbol = "SOXL"
paper_model = "futures"
leverage = 2
margin_mode = "isolated"
position_fraction = 0.625
fee_bps = 5.0
slippage_bps = 2.0
minimum_notional = 5.0

[[instruments]]
id = "soxl_perp_long"
symbol = "SOXLUSDT"
display_symbol = "SOXL/USDT PERP LONG ONLY"
name = "Direxion Semiconductor Bull 3X TradFi Perpetual Long Only"
asset_type = "tradifi_perpetual"
venue = "Binance USD-M Futures"
currency = "USDT"
feed = "binance_futures"
quantity_step = 0.01
reference_symbol = "SOXL"
paper_model = "futures"
leverage = 2
margin_mode = "isolated"
position_fraction = 0.625
fee_bps = 5.0
slippage_bps = 2.0
minimum_notional = 5.0
market_data_id = "soxl_perp"
allow_short = false
